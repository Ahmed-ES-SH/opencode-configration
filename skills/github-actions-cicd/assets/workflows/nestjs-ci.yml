# Copy to .github/workflows/ci.yml
# Adjust: database image/version to match the project, test script names,
# and add a Prisma/TypeORM migrate step before e2e tests if applicable.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Uncomment if using Prisma:
      # - name: Run migrations
      #   run: npx prisma migrate deploy
      #   env:
      #     DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: test-secret-not-for-production

      - name: Build
        run: npm run build
